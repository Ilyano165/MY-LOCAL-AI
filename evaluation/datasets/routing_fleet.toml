# Feste Evaluationsflotte für den Routing-Datensatz (fiktive Modellklassen, keine echten Modelle).
#
# Die Werte sind bewusst KONFIGURIERTE Annahmen und gehören nur zur Evaluation: Sie bilden einen
# typischen lokalen Bestand ab (klein/schnell, Allround, Coder, Denker, Vision, Langkontext,
# multimodal). So ist die Baseline reproduzierbar und unabhängig von der Hardware des Nutzers.

[[providers]]
name = "eval"
type = "openai_compatible"
base_url = "http://127.0.0.1:1"

[[models]]
name = "fast-small"
provider = "eval"
parameter_count = "3B"
context_length = 8192
reasoning_capability = "basic"
coding_capability = "basic"
vision_capability = "none"
tool_calling = true
speed = "fast"
memory_requirement = 2.5
quantization = "Q4_K_M"

