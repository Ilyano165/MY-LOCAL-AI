[project]
name = "nova"
version = "0.1.0"
description = "NOVA – vollständig lokale, persönliche KI-Plattform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["models", "agents", "tools", "memory", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: benötigt eine laufende lokale Inference-Runtime (NOVA_IT_BASE_URL)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
# Deutsche Typografie (Gedankenstrich „–") in Texten ist gewollt.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests dürfen synchron auf das Dateisystem zugreifen (Vorbereitung/Prüfung).
"tests/**" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["models", "agents", "tools", "memory", "evaluation"]
